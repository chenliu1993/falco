on:
  workflow_dispatch:

env:
  AWS_S3_REGION: ap-northeast-1
  FALCO_VERSION: 0.40.0-priv
jobs:
  build-test-publish:
    runs-on: "ubuntu-22.04"
    steps:
      - name: Checkout
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - name: Build
        run: |
          time ./build.sh
      - name: Pre Test
        run: |
          tar -zxvf build/falco-${{ env.FALCO_VERSION }}-x86_64.tar.gz
          cd falco-${{ env.FALCO_VERSION }}-x86_64
          sudo cp -r * /

          sudo apt update -y
          sudo apt install -y --no-install-recommends linux-headers-$(uname -r) libasan5 libubsan1
      - name: Run tests
        env:
          LSAN_OPTIONS: "intercept_tls_get_addr=0"
        uses: falcosecurity/testing@main
        with:
          test-falco: "true"
          test-falcoctl: "true"
          test-k8saudit: "true"
          test-dummy: "true"
          static: "false"
          test-drivers: "true"
          show-all: "true"
          report-name-suffix: ""

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@010d0da01d0b5a38af31e9c3470dbfdabdecca3a # v4.0.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_S3_REGION }}
      - name: Publish tar
        run: |
          aws s3 cp build/falco-${{ env.FALCO_VERSION }}-x86_64.tar.gz s3://falco/falco-${{ env.FALCO_VERSION }}-x86_64.tar.gz --acl public-read
